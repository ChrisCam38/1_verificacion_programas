aci&#xf3;n del Programa","children":[{"content":"Define qu&#xe9; debe hacer el programa, no c&#xf3;mo debe hacerlo.","children":[],"payload":{"tag":"li","lines":"20,21"}},{"content":"Est&#xe1; compuesta por:","children":[{"content":"<strong>Precondici&#xf3;n (Q):</strong> condiciones que deben cumplir los estados iniciales.","children":[],"payload":{"tag":"li","lines":"22,23"}},{"content":"<strong>Poscondici&#xf3;n (R):</strong> condiciones que deben cumplir los estados finales y relaci&#xf3;n entre entradas y salidas.","children":[],"payload":{"tag":"li","lines":"23,24"}}],"payload":{"tag":"li","lines":"21,24"}},{"content":"Utiliza variables sem&#xe1;nticas para representar los valores iniciales que no pueden modificarse durante la ejecuci&#xf3;n.","children":[],"payload":{"tag":"li","lines":"24,26"}}],"payload":{"tag":"h2","lines":"19,20"}},{"content":"L&#xf3;gica de Hoare","children":[{"content":"Propuesta por Tony Hoare en 1969.","children":[],"payload":{"tag":"li","lines":"27,28"}},{"content":"Permite razonar formalmente sobre la correcci&#xf3;n de programas.","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"Su elemento fundamental es la <strong>Tripla de Hoare</strong>:","children":[{"content":"{Q} S {R}","children":[],"payload":{"tag":"li","lines":"30,31"}},{"content":"Q = Precondici&#xf3;n","children":[],"payload":{"tag":"li","lines":"31,32"}},{"content":"S = Programa","children":[],"payload":{"tag":"li","lines":"32,33"}},{"content":"R = Poscondici&#xf3;n","children":[],"payload":{"tag":"li","lines":"33,34"}}],"payload":{"tag":"li","lines":"29,34"}},{"content":"Una tripla es v&#xe1;lida si todo estado que satisface Q, al ejecutar S, termina en un estado que satisface R.","children":[],"payload":{"tag":"li","lines":"34,36"}}],"payload":{"tag":"h2","lines":"26,27"}},{"content":"Correcci&#xf3;n y Propiedades","children":[{"content":"Propiedades de las Triplas de Hoare","children":[{"content":"Precondici&#xf3;n vac&#xed;a: {falso}S{R} siempre es
